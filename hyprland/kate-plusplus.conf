# kate-plusplus · Notepad overlay for Caelestia (legacy hyprland.conf setups)
# Sourced from ~/.config/caelestia/hypr-user.conf. Generated by `kate-plusplus install`.
windowrule = workspace special:notepad, class:^(kate-scratchpad)$
windowrule = float, class:^(kate-scratchpad)$
windowrule = size 52% 66%, class:^(kate-scratchpad)$
windowrule = center, class:^(kate-scratchpad)$
bind = @HOTKEY_CONF@, exec, caelestia toggle notepad
