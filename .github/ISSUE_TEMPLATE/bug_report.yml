name: 🐞 Bug report
description: Something doesn't work the way the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! The fastest way to a fix is the output of `kate-plusplus doctor`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I pressed Ctrl+D and the line was commented instead of duplicated…"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `kate-plusplus doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: flavour
    attributes:
      label: Flavour
      options:
        - Caelestia · Hyprland
        - KDE Plasma
        - GNOME / other desktop
        - Not sure
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro
      placeholder: "EndeavourOS, Fedora 43, Ubuntu 26.04…"
  - type: dropdown
    id: install
    attributes:
      label: Installed via
      options: [One-line installer, AUR (yay / paru), Git checkout]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
