# Kate++ — the Notepad++-style Kate settings.
#
# Merged key-by-key into katerc (nothing else in your katerc is touched).
# Nested KConfig groups are written as [Outer][Inner].
# A value of @delete removes the key so Kate falls back to its default.

# --- Startup & memory: Notepad++-style "remember everything" -------------
[General]
# Always reopen the "Notepad" session, straight into your tabs.
Startup Session=last
Last Session=Notepad
Show welcome view for new window=false
# Closing Kate never asks to save: unsaved tabs and unsaved edits are
# stashed and come back exactly as they were on the next start.
Stash new unsaved files=true
Stash unsaved file changes=true
Restore Window Configuration=true

# --- Window chrome --------------------------------------------------------
Show Menu Bar=true
Show Status Bar=true
Show Full Path in Title=true

# --- Tabs like Notepad++ --------------------------------------------------
Tabbar Tab Limit=0
Show Tabs Close Button=true
Expand Tabs=false
Elide Tab Text=false
Allow Tab Scrolling=true
Tab Double Click New Document=true
Tab Middle Click Close Document=true
Open New Tab To The Right Of Current=false

# --- Editor look (font, spacing and colours come from config.ini) --------
[KTextEditor Renderer]
Show Indentation Lines=true
Animate Bracket Matching=true
Word Wrap Marker=false

# --- Editor behaviour -----------------------------------------------------
[KTextEditor View]
Scroll Bar Mini Map Width=70
Scroll Bar Preview=true
Scroll Bar Marks=true
Scroll Past End=true
Folding Bar=true
Folding Preview=true
Icon Bar=false
Bracket Match Preview=true
Auto Brackets=true
# Ctrl+C / Ctrl+X with nothing selected copies/cuts the whole line
Smart Copy Cut=true
Show Word Count=true
Show Line Count=true

[KTextEditor Document]
# Mark trailing whitespace only (not every space)
Show Spaces=1
# Never silently rewrite files on save
Remove Spaces=0

# --- Shortcuts ------------------------------------------------------------
# Notepad++ shortcuts are merged into Kate's own shortcut files (see shortcuts/),
# so Kate's default scheme stays active and every other key keeps working.
[Shortcut Schemes]
Current Scheme=@delete

# --- Plugins --------------------------------------------------------------
[Kate Plugins]
katefiletreeplugin=true
kateprojectplugin=true
katesearchplugin=true
katekonsoleplugin=true
lspclientplugin=true
tabswitcherplugin=true
# Notepad++ "Function List"
katesymbolviewerplugin=true
# Notepad++ macros (record Ctrl+Shift+R, play Ctrl+Shift+P)
keyboardmacrosplugin=true
# "Close all but this" / "Close all to the left/right"
katecloseexceptplugin=true
# Colour swatches next to #hex codes
katecolorpickerplugin=true
rainbowparens=true
# Markdown / HTML preview
ktexteditorpreviewplugin=true
# Notepad++ "Folder as Workspace"
katefilebrowserplugin=true
textfilterplugin=true
bookmarksplugin=true
openlinkplugin=true
formatplugin=true
# Snippets panel + the Kate++ snippet pack (date, todo, shebangs, …)
katesnippetsplugin=true
