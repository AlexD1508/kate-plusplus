# ╭──────────────────────────────────────────────────────────────╮
# │  Kate++ settings                                             │
# │  Edit, save, then run:   kate-plusplus apply                 │
# │  (or just `kate-plusplus` for the menu)                      │
# ╰──────────────────────────────────────────────────────────────╯

[general]
profile = auto              # auto | caelestia | generic


[features]
# Opt-in: a hotkey that pops a floating Kate notepad up and away again.
# Caelestia + Hyprland only; ignored everywhere else.
notepad-overlay = false
notepad-hotkey = SUPER + J

# Open text, Markdown, JSON, YAML, log and config files in Kate.
default-editor = true

# Snapshot Kate's sessions and unsaved tabs every 10 minutes,
# so a crash or power cut never eats a note.
backups = true
backup-keep-days = 2


[theme]
# Where the editor colours come from:
#   auto      Caelestia wallpaper → KDE Plasma colours → Kate++ Dark/Light
#   caelestia follow the Caelestia wallpaper scheme
#   plasma    follow your KDE Plasma colour scheme + accent colour
#   dark      Kate++ Dark          light   Kate++ Light
#   none      leave Kate's colours alone
source = auto

# Your own touch. Use any hex colour, e.g.  accent = #7aa2f7
# Leave empty to follow the source. Readability is always enforced.
accent =
background =

# How colourful the code is:  soft | balanced | vivid
syntax-colors = balanced


[editor]
font = auto                 # auto = JetBrains Mono if installed, else system monospace
font-size = 11
line-spacing = 1.15         # 1.0 = compact, 1.3 = airy
minimap = true              # document map next to the scrollbar
