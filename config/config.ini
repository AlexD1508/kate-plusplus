# ╭──────────────────────────────────────────────────────────────╮
# │  Kate++ settings                                             │
# │  Edit, save, then run:   kate-plusplus apply                 │
# │  (or just `kate-plusplus` for the menu)                      │
# ╰──────────────────────────────────────────────────────────────╯

[general]
profile = auto              # auto | caelestia | generic


[features]
# Opt-in: a hotkey that pops a floating Kate notepad up and away again.
# Caelestia + Hyprland only; ignored everywhere else.
notepad-overlay = false
notepad-hotkey = SUPER + J

# A Notepad++-style "Language" menu on the menu bar: pick Java, Python, … for any
# tab, including unsaved drafts (they keep their language when Kate reopens).
language-menu = true

# Open text, Markdown, JSON, YAML, log and config files in Kate.
default-editor = true

# Snapshot Kate's sessions and unsaved tabs every 10 minutes,
# so a crash or power cut never eats a note.
backups = true
backup-keep-days = 2


[theme]
# Where the editor colours come from:
#   auto      Caelestia wallpaper → KDE Plasma colours → Kate++ Dark/Light
#   caelestia follow the Caelestia wallpaper scheme
#   plasma    follow your KDE Plasma colour scheme + accent colour
#   dark      Kate++ Dark          light   Kate++ Light
#   none      leave Kate's colours alone
#   …or any theme by name (capitals and spaces don't matter):
#     rose-pine · kanagawa · everforest · night-owl · synthwave-84
#     Catppuccin Mocha · Dracula · Nord · Tokyo Night · gruvbox Dark · …
source = auto

# Your own touch for the adaptive themes (auto, caelestia, plasma, dark, light).
# Named themes like Rosé Pine keep their designers' colours.
# Use any hex colour, e.g.  accent = #7aa2f7  ·  empty = follow the source.
# Readability is always enforced.
accent =
background =

# How colourful the code is:  soft | balanced | vivid
syntax-colors = balanced

# Window colours (menus, tabs, sidebars, status bar):
#   match   follow the editor theme, so Rosé Pine colours the whole window
#   system  leave them to your desktop / your own choice in Kate
# Caelestia and Plasma sources always follow the desktop, which already matches.
# A scheme you pick in Kate (Settings → Window Color Scheme) after installing is
# never overwritten. On first install the previous one is replaced; uninstall restores it.
window-colors = match


[editor]
# auto = JetBrains Mono if installed, else your system monospace.
# Shortcuts: jetbrains-mono · cascadia · fira · iosevka · maple, or any installed family name.
font = auto
font-size = 11
line-spacing = 1.15         # 1.0 = compact, 1.3 = airy
minimap = true              # document map next to the scrollbar
ligatures = true            # joined symbols like => != ->  (false = plain characters)

# Prettify the whole file with Ctrl+Alt+Shift+B (uses prettier, ruff, jq, clang-format,
# shfmt… when installed; `kate-plusplus doctor` shows which you have).
# Kate's own default reformats on every save; Kate++ turns that off unless you want it.
format-on-save = false

# With a language server installed (see `kate-plusplus doctor`): colour code by meaning
# (parameters, types, constants…), show parameter names / types inline, hover docs,
# signature help and error underlines.
# false = Kate++ stops managing these (switch them off in Kate's LSP Client settings).
smart-highlighting = true

# Auto-save tabs that have a file path on your disk (untitled tabs stay stashed;
# a path you opened that doesn't exist yet is created on the first auto-save):
#   off    Kate++ leaves Kate's own auto-save setting alone
#   focus  save when the editor loses focus: switching apps, or moving to the
#          find bar, file tree or another panel inside Kate
#   30     also save 30 seconds after your last edit (any number from 5 to 3600)
auto-save = off
