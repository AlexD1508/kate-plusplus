# CodeRabbit review settings (v3): https://docs.coderabbit.ai/reference/configuration-v3
# Project-specific review rules and pre-merge checks live in .coderabbit/
version: 3
language: en-US
inheritance: true
reviews:
  behavior:
    profile: assertive
    path_filters:
      - "!assets/**/*.png"
      - "!assets/**/*.gif"
      - "!packaging/aur/.SRCINFO"
    merge_risk_instructions: |
      Kate++ edits files in the user's home directory that belong to other programs
      (Kate's katerc, session files, kxmlgui shortcut files, mimeapps.list, Hyprland and
      Caelestia configs). Treat as high risk any change that could lose user data, overwrite
      settings the user set themselves, or that `kate-plusplus uninstall` would not fully
      reverse. Treat changes to shortcut handling as high risk: a KDE shortcut scheme once
      wiped every key in Kate (Backspace, Delete, arrows).
    security_risk_instructions: |
      The installer is run via `curl | bash`. Flag anything that executes untrusted input,
      builds shell commands from config values (subprocess with shell=True, os.system,
      unquoted variables), writes outside the user's home, or needs root.
    auto_approvals:
      enabled: true
      min_blocking_severity: major
      max_merge_risk: low
  auto_review:
    enabled: true
    drafts: false
    incremental_review: true
  output:
    review_details: true
    metadata:
      labels:
        mode: apply
        instructions:
          - label: bug
            instructions: The PR fixes incorrect behaviour.
          - label: enhancement
            instructions: The PR adds a feature or improves an existing one.
          - label: theme
            instructions: The PR changes the theme engine or adds or changes editor themes.
          - label: packaging
            instructions: The PR changes packaging/aur/ or the installer.
          - label: documentation
            instructions: The PR only changes README, CHANGELOG, CONTRIBUTING or other docs.
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    pylint:
      enabled: false
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    eslint:
      enabled: false
    biome:
      enabled: false
fun:
  in_progress_fortune: false
  art: false
