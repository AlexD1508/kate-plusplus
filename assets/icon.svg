<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Kate++</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="0.55" stop-color="#b56cf0"/>
      <stop offset="1" stop-color="#ff86b8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262733"/>
      <stop offset="1" stop-color="#1b1c22"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6fb"/>
      <stop offset="1" stop-color="#f1e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a0f4a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="120" rx="58" fill="#fff" opacity="0.07"/>

  <!-- editor page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M60 48 h96 l40 40 v112 a12 12 0 0 1 -12 12 h-124 a12 12 0 0 1 -12 -12 v-140 a12 12 0 0 1 12 -12 z" fill="url(#page)"/>
    <path d="M156 48 v28 a12 12 0 0 0 12 12 h28 z" fill="#3a3b4a"/>
  </g>

  <!-- code lines in Kate++ syntax colours -->
  <g stroke-linecap="round" stroke-width="10">
    <line x1="72" y1="86"  x2="98"  y2="86"  stroke="#c3a6ff"/>
    <line x1="110" y1="86" x2="138" y2="86"  stroke="#8fb8ff"/>
    <line x1="84" y1="112" x2="104" y2="112" stroke="#c3a6ff"/>
    <line x1="116" y1="112" x2="170" y2="112" stroke="#9bd6a2"/>
    <line x1="84" y1="138" x2="132" y2="138" stroke="#e8c27a"/>
    <line x1="144" y1="138" x2="158" y2="138" stroke="#f2a07b"/>
    <line x1="72" y1="164" x2="112" y2="164" stroke="#7d7f8f"/>
  </g>

  <!-- ++ badge -->
  <g filter="url(#shadow)">
    <circle cx="186" cy="186" r="42" fill="url(#badge)"/>
  </g>
  <g fill="#8b5cf6">
    <rect x="160" y="182" width="24" height="8" rx="4"/>
    <rect x="168" y="174" width="8" height="24" rx="4"/>
    <rect x="188" y="182" width="24" height="8" rx="4"/>
    <rect x="196" y="174" width="8" height="24" rx="4"/>
  </g>
</svg>
